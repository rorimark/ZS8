<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>23.10.2025 - ZEGAR</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body onload="setInterval('clock()', 1000)">
    <div class="container">
      <div class="hours">
        <div class="hour-left">
          <div class="hour-left-1"></div>
          <div class="hour-left-2"></div>
          <div class="hour-left-3"></div>
          <div class="hour-left-4"></div>
        </div>
        <div class="hour-right">
          <div class="hour-right-1"></div>
          <div class="hour-right-2"></div>
          <div class="hour-right-3"></div>
          <div class="hour-right-4"></div>
        </div>
      </div>
      <div class="minutes">
        <div class="minute-left">
          <div class="minute-left-1"></div>
          <div class="minute-left-2"></div>
          <div class="minute-left-3"></div>
          <div class="minute-left-4"></div>
        </div>
        <div class="minute-right">
          <div class="minute-right-1"></div>
          <div class="minute-right-2"></div>
          <div class="minute-right-3"></div>
          <div class="minute-right-4"></div>
        </div>
      </div>
      <div class="seconds">
        <div class="second-left">
          <div class="second-left-1"></div>
          <div class="second-left-2"></div>
          <div class="second-left-3"></div>
          <div class="second-left-4"></div>
        </div>
        <div class="second-right">
          <div class="second-right-1"></div>
          <div class="second-right-2"></div>
          <div class="second-right-3"></div>
          <div class="second-right-4"></div>
        </div>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
